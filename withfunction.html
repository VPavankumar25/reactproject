<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

        function createCard(name,image){

            return (
                <div id="card">
                <img src={image} height="50%" width="70%"/>

                <h2>{name}</h2>
            </div>

            );

        }
        ReactDOM.render([
            createCard("Sai Vardhan","https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"),
            createCard("Pratiksha","https://media.gettyimages.com/id/1591572504/photo/cheerful-businesswomen-shaking-hands-in-meeting-room.jpg?s=1024x1024&w=gi&k=20&c=aYP1-RE7e5t9KmZoePD8y3n1Wiab_cou8aByfIb2H34=")
        ]
        , document.getElementById('root'));
    </script>
    
</body>
</html>
